[project]
name = "seo-os"
version = "0.1.0"
description = "AI SEO Operating System — local-first, $0/month"
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # Database
    "asyncpg>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",      # Alembic's sync driver for migrations
    # Auth / crypto
    "cryptography>=43",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    # Logging
    "structlog>=24.4",
    # Utilities
    "python-ulid>=3.0",
    "croniter>=3.0",             # cron expression evaluation for the scheduler (docs §24)
]

[project.optional-dependencies]
# Bundled PostgreSQL 16 + pgvector. No Docker, no sudo, no admin rights.
# Docker Compose (docs §32) remains the recommended path where available.
localpg = ["pgserver>=0.1.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC", "S"]
ignore = [
    "S101",  # assert — used in tests
    "B008",  # function call in default arg — FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Local dev utility; every subprocess call targets a bundled binary we control.
"scripts/pg.py" = ["S603", "S607", "SIM114", "S608"]
"packages/db/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "apps/api"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "packages.db.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
